name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      verify_failure_test:
        description: 'Corrupt the generated tarball before checksum verification'
        required: false
        default: 'false'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash-builtins \
            build-essential

      - name: Build release bundle
        run: |
          set -euxo pipefail
          test -d /usr/include/bash
          make dist BASH_SRC=/usr/include/bash

      - name: Corrupt tarball for checksum failure test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure_test == 'true' }}
        run: |
          set -euxo pipefail
          printf 'corrupt\n' >> build/release/*.tar.gz

      - name: Verify release checksum
        run: |
          set -euxo pipefail
          sha256sum -c build/release/*.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            build/release/*.tar.gz
            build/release/*.sha256
          if-no-files-found: error
